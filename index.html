<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連続動画撮影アプリ（縦画面対応）</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 20px; background: #f4f4f4; }
    
    /* 9:16の縦長アスペクト比に固定 */
    .video-container {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    .controls { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; max-width: 320px; }
    .input-group { display: flex; gap: 8px; align-items: center; }
    .btn-group { display: flex; gap: 8px; width: 100%; }
    button { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 6px; background: #007bff; color: white; font-weight: bold; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>縦長（9:16）動画撮影</h2>
  
  <div class="video-container">
    <video id="preview" autoplay playsinline muted></video>
    <video id="result" controls style="display:none;"></video>
  </div>

  <div class="controls">
    <div class="input-group">
      <label for="secInput">1コマの秒数:</label>
      <input type="number" id="secInput" value="3" min="1" style="width:50px; padding: 4px;"> 秒
    </div>
    <div class="btn-group">
      <button id="startBtn">カメラ起動</button>
      <button id="recordBtn" disabled>撮影開始</button>
      <button id="stopBtn" disabled>終了・結合</button>
    </div>
  </div>

  <p id="status">カメラを起動してください。</p>

  <script>
    let stream;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const secInput = document.getElementById('secInput');
    const startBtn = document.getElementById('startBtn');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    // 1. カメラの起動（縦長 9:16 の解像度を要求）
    startBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: { ideal: 1080 },
            height: { ideal: 1920 },
            facingMode: "user" // スマホのインカメラを優先（リアカメラ希望なら "environment"）
          }, 
          audio: true 
        });
        preview.srcObject = stream;
        startBtn.disabled = true;
        recordBtn.disabled = false;
        status.textContent = '準備完了。「撮影開始」を押してください。';
      } catch (err) {
        alert('カメラへのアクセスが拒否されたか、指定サイズに対応していません。');
      }
    });

    // 2. 指定秒数ごとの連続撮影処理
    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      isRecording = true;
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      result.style.display = 'none';
      preview.style.display = 'block';

      const intervalSec = parseFloat(secInput.value) * 1000;

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
          status.textContent = `撮影中... (${recordedChunks.length}コマ目保存完了)`;
        }
      };

      mediaRecorder.start(intervalSec);
      status.textContent = '撮影を開始しました...';
    });

    // 3. 撮影終了と結合
    stopBtn.addEventListener('click', () => {
      isRecording = false;
      mediaRecorder.stop();

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const videoUrl = URL.createObjectURL(blob);

        preview.style.display = 'none';
        result.src = videoUrl;
        result.style.display = 'block';

        recordBtn.disabled = false;
        stopBtn.disabled = true;
        status.textContent = '動画の結合が完了しました！';
      };
    });
  </script>
</body>
</html>
