<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連続コマ撮りアプリ（ダウンロード機能付き）</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px; background: #f4f4f4; margin: 0; }
    
    .video-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    canvas, video { width: 100%; height: 100%; object-fit: cover; }
    #videoPreview { display: none; }

    .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    select, input, button, a.btn { padding: 10px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button, a.btn { cursor: pointer; background: #007bff; color: white; border: none; font-weight: bold; text-align: center; text-decoration: none; display: inline-block; box-sizing: border-box; }
    button:disabled, a.btn.disabled { background: #ccc; cursor: not-allowed; pointer-events: none; opacity: 0.6; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    
    /* ダウンロードボタン用スタイル */
    a.download-btn { background: #17a2b8; display: none; font-size: 16px; padding: 12px; }
    
    #permissionBtn { background: #17a2b8; font-size: 16px; padding: 12px; }
    #status { margin: 5px 0; font-size: 14px; color: #333; text-align: center; }
  </style>
</head>
<body>

  <h2>コマ撮り撮影（縦9:16対応）</h2>

  <div class="video-container">
    <video id="videoPreview" autoplay playsinline muted></video>
    <canvas id="canvasPreview"></canvas>
    <video id="result" controls style="display:none;"></video>
  </div>

  <div class="controls">
    <!-- 最初に使用許可を得る領域 -->
    <button id="permissionBtn">カメラとマイクの使用を許可する</button>

    <!-- 許可後に有効化される操作群 -->
    <select id="cameraSelect" disabled>
      <option value="">カメラを選択してください</option>
    </select>

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label for="secInput">1コマの撮影時間:</label>
      <input type="number" id="secInput" value="3" min="1" style="width:60px;"> 秒
    </div>

    <button id="captureBtn" class="success" disabled>1コマ撮影</button>
    
    <div class="btn-group">
      <button id="deleteBtn" class="danger" disabled>直前コマ削除</button>
      <button id="finishBtn" disabled>撮影終了・結合</button>
    </div>

    <!-- 動画生成後に表示されるダウンロードボタン -->
    <a id="downloadBtn" class="btn download-btn">動画をダウンロード</a>
  </div>

  <p id="status">「カメラとマイクの使用を許可する」を押してください。</p>

  <script>
    let currentStream;
    let recordedChunks = [];

    const video = document.getElementById('videoPreview');
    const canvas = document.getElementById('canvasPreview');
    const ctx = canvas.getContext('2d');
    const result = document.getElementById('result');
    
    const permissionBtn = document.getElementById('permissionBtn');
    const cameraSelect = document.getElementById('cameraSelect');
    const secInput = document.getElementById('secInput');
    const captureBtn = document.getElementById('captureBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const finishBtn = document.getElementById('finishBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    canvas.width = 720;
    canvas.height = 1280;

    // 1. 最初に使用許可を取得
    permissionBtn.addEventListener('click', async () => {
      try {
        const dummyStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        dummyStream.getTracks().forEach(track => track.stop());

        await populateCameraList();

        permissionBtn.style.display = 'none';
        cameraSelect.disabled = false;
        status.textContent = 'カメラを選択してください。';

      } catch (err) {
        alert('カメラまたはマイクの使用許可が得られませんでした。ブラウザの設定から許可してください。');
        status.textContent = 'カメラへのアクセスが拒否されました。';
      }
    });

    // カメラデバイスリストの取得
    async function populateCameraList() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      
      cameraSelect.innerHTML = '<option value="">カメラを選択してください</option>';
      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `カメラ ${index + 1}`;
        cameraSelect.appendChild(option);
      });
    }

    // 2. カメラの切り替え
    cameraSelect.addEventListener('change', async () => {
      if (!cameraSelect.value) return;

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: cameraSelect.value } },
          audio: true
        });
        video.srcObject = currentStream;
        video.play();

        renderCanvas();

        captureBtn.disabled = false;
        status.textContent = '準備完了。「1コマ撮影」を押してください。';
      } catch (err) {
        alert('カメラの切り替えに失敗しました。');
      }
    });

    // 9:16にクロップ描画するループ
    function renderCanvas() {
      if (video.videoWidth > 0) {
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;

        let sWidth = vHeight * (9 / 16);
        let sHeight = vHeight;
        let sx = (vWidth - sWidth) / 2;
        let sy = 0;

        if (sWidth > vWidth) {
          sWidth = vWidth;
          sHeight = vWidth * (16 / 9);
          sx = 0;
          sy = (vHeight - sHeight) / 2;
        }

        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(renderCanvas);
    }

    // 3. 1コマ手動撮影
    captureBtn.addEventListener('click', () => {
      const duration = parseFloat(secInput.value) * 1000;
      const canvasStream = canvas.captureStream(30);
      
      if (currentStream && currentStream.getAudioTracks().length > 0) {
        canvasStream.addTrack(currentStream.getAudioTracks()[0]);
      }

      const recorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      
      recorder.onstop = () => {
        const singleChunkBlob = new Blob(chunks, { type: 'video/webm' });
        recordedChunks.push(singleChunkBlob);

        captureBtn.disabled = false;
        deleteBtn.disabled = false;
        finishBtn.disabled = false;
        status.textContent = `コマを撮影しました。（現在: ${recordedChunks.length}コマ）`;
      };

      captureBtn.disabled = true;
      status.textContent = `撮影中... (${secInput.value}秒)`;
      recorder.start();

      setTimeout(() => {
        recorder.stop();
      }, duration);
    });

    // 4. 直前のコマを削除
    deleteBtn.addEventListener('click', () => {
      if (recordedChunks.length > 0) {
        recordedChunks.pop();
        status.textContent = `直前のコマを削除しました。（残り: ${recordedChunks.length}コマ）`;
        
        if (recordedChunks.length === 0) {
          deleteBtn.disabled = true;
          finishBtn.disabled = true;
        }
      }
    });

    // 5. 撮影終了・結合とダウンロード設定
    finishBtn.addEventListener('click', () => {
      if (recordedChunks.length === 0) return;

      const finalBlob = new Blob(recordedChunks, { type: 'video/webm' });
      const videoUrl = URL.createObjectURL(finalBlob);

      // プレビュー表示切り替え
      canvas.style.display = 'none';
      result.src = videoUrl;
      result.style.display = 'block';

      // 日時（YYYYMMDD_HHMMSS）付きファイル名でダウンロードボタンを設定
      const now = new Date();
      const timestamp = now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + '_' +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0') +
        String(now.getSeconds()).padStart(2, '0');

      downloadBtn.href = videoUrl;
      downloadBtn.download = `video_${timestamp}.webm`;
      downloadBtn.style.display = 'block';

      status.textContent = '動画の結合が完了しました！下のボタンからダウンロードできます。';
    });
  </script>
</body>
</html>
